name: wordwise
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cupertino_icons: ^1.0.8
  drift: ">=2.32.0 <2.35.0"
  file_picker: ^12.3.0
  flutter:
    sdk: flutter
  flutter_riverpod: ">=3.0.0"
  flutter_tts: ^4.2.5
  go_router: ^17.5.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  sqlite3: ^3.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ">=2.32.0 <2.34.6"
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/words.sqlite
    - assets/words.version
